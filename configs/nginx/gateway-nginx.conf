# gateway-nginx — the front door. It does not answer by itself; it passes
# each request to the right service, and to a backup when that service is down.
#
# The same file runs in all three DCs. Every container has a fixed IP,
# so the addresses below are true everywhere.
#
# max_fails=3 fail_timeout=10s : 3 failures within 10s marks a server as down
#                                for the next 10s.
# backup                       : used only when every normal server is down.

upstream user_service {
    server 10.20.2.10:8080 max_fails=3 fail_timeout=10s;   # DC1
    server 10.40.2.10:8080 backup;                         # DC3 standby
}

upstream catalog_service {
    server 10.20.2.11:8081 max_fails=3 fail_timeout=10s;   # DC1
    server 10.40.2.11:8081 backup;                         # DC3 standby
}

upstream order_service {
    server 10.20.2.12:8082 max_fails=3 fail_timeout=10s;   # DC1
    server 10.30.2.12:8082 max_fails=3 fail_timeout=10s;   # DC2 replica, shares the load
    server 10.40.2.12:8082 backup;                         # DC3 standby
}

upstream payment_service {
    server 10.30.2.10:8083 max_fails=3 fail_timeout=10s;   # DC2
    server 10.40.2.13:8083 backup;                         # DC3 standby
}

upstream notify_service {
    server 10.30.2.11:8084 max_fails=3 fail_timeout=10s;   # DC2
    server 10.40.2.14:8084 backup;                         # DC3 standby
}

upstream analytics_service {
    server 10.40.2.15:8085;                                # DC3 only
}

upstream discovery_service {
    server 10.40.2.16:8500;                                # DC3 only
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Give up on a dead server fast, and try the next one straight away.
    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;
    proxy_next_upstream   error timeout http_502 http_503 http_504;

    # Shows which server really answered. Handy when testing failover.
    add_header X-Served-By $upstream_addr always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location /users/     { proxy_pass http://user_service/; }
    location /catalog/   { proxy_pass http://catalog_service/; }
    location /orders/    { proxy_pass http://order_service/; }
    location /payments/  { proxy_pass http://payment_service/; }
    location /notify/    { proxy_pass http://notify_service/; }
    location /analytics/ { proxy_pass http://analytics_service/; }
    location /discovery/ { proxy_pass http://discovery_service/; }
}
