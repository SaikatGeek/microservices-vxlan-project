# order-nginx — answers on port 8082 with a fixed JSON reply.
server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;

    # Docker's health check calls this every few seconds.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Any other path gets the service's JSON reply.
    location / {
        default_type application/json;
        try_files /index.json =404;
    }
}
