<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img">
<title>Service architecture: gateway routing and failover</title>
<desc>The gateway sends each path to its normal servers in DC1 or DC2, shares orders between DC1 and DC2, and falls back to the DC3 standby copy when the normal servers are down. Analytics and discovery run only in DC3.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1100" height="660" fill="#FFFFFF"/>
<text x="40" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="start">Service architecture: gateway routing and failover</text>
<text x="40" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start">The same gateway config runs in DC1, DC2 and DC3. Every container has a fixed IP, so these addresses are true everywhere.</text>
<text x="360" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="middle">path</text>
<text x="610" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="middle">normal servers</text>
<text x="940" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5F5E5A" text-anchor="middle">backup (only if all are down)</text>
<rect x="40" y="250" width="200" height="124" rx="8" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.6"/>
