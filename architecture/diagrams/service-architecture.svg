<text x="40" y="612" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start">max_fails=3 fail_timeout=10s  ·  proxy_connect_timeout 2s  ·  proxy_next_upstream error timeout 502 503 504: a failed server is skipped within the same request.</text>
<text x="40" y="634" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2C2C2A" text-anchor="start">Every service image has a Docker HEALTHCHECK on /health every 10s.  Limits: gateway 256 MB / 0.50 CPU, services 128 MB / 0.25 CPU, db and cache stubs 64 MB / 0.10 CPU.</text>
